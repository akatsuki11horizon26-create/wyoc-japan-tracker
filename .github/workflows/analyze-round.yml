name: Analyze WYOC Japan round

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      round_number:
        description: "Round number or auto"
        required: true
        default: "auto"
        type: string
      force_refresh:
        description: "Disable the HTML cache for this run"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: wyoc-japan-tracker-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore WBF HTML cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: wbf-html-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wbf-html-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify package import
        run: python -c "import wyoc_tracker; print(wyoc_tracker.__file__)"

      - name: Run tests
        run: python -m pytest -q

      - name: Generate report
        env:
          INPUT_ROUND_NUMBER: ${{ inputs.round_number }}
          INPUT_FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          ROUND="${INPUT_ROUND_NUMBER:-3}"
          if [ "$INPUT_FORCE_REFRESH" = "true" ] || [ "$ROUND" = "3" ]; then REFRESH="--no-cache"; else REFRESH=""; fi
          echo "REPORT_ROUND=$ROUND" >> "$GITHUB_ENV"
          python -m wyoc_tracker.cli \
            --round "$ROUND" \
            --output-dir reports \
            --cache-dir data/cache \
            --history-dir data/history \
            $REFRESH

      - name: Verify output formats
        if: env.REPORT_ROUND != 'auto'
        run: |
          PADDED=$(printf '%02d' "$REPORT_ROUND")
          test -s "reports/round-${PADDED}.md"
          test -s "reports/round-${PADDED}.json"
          test -s "reports/round-${PADDED}.html"

      - name: Upload report, history, and source cache
        uses: actions/upload-artifact@v4
        with:
          name: wyoc-round-${{ env.REPORT_ROUND }}-${{ github.run_number }}
          path: |
            reports/
            data/history/
            data/cache/
          if-no-files-found: error

      - name: Persist reports on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/history
          if git diff --cached --quiet; then
            echo "No new report data to commit."
          else
            git commit -m "chore: update WYOC reports [skip ci]"
            git push
          fi
